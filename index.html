<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Muck</title>
  <script src="Build/UnityLoader.js"></script>
  <style>
    [hidden] { display: none !important; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    /* The game is the whole browser window and follows it when resized. */
    #unityContainer { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; }
    #unityContainer canvas { width: 100% !important; height: 100% !important; display: block; outline: none; }

    #start { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 10; display: flex; align-items: center; justify-content: center; background: #111; color: #eee; font-family: Arial, Helvetica, sans-serif; }
    #start form { width: 320px; max-width: calc(100vw - 48px); text-align: center; }
    #start h1 { font-size: 48px; margin: 0 0 8px; letter-spacing: 4px; }
    #start p { color: #aaa; margin: 0 0 24px; }
    #start input { box-sizing: border-box; width: 100%; padding: 12px; font-size: 18px; border: 2px solid #444; border-radius: 6px; background: #1c1c1c; color: #eee; text-align: center; }
    #start button { box-sizing: border-box; margin-top: 12px; width: 100%; padding: 12px; font-size: 18px; border: 0; border-radius: 6px; background: #d9a441; color: #111; font-weight: bold; cursor: pointer; }
    #start button:disabled { opacity: 0.5; cursor: default; }
    #bar { height: 8px; background: #333; border-radius: 4px; overflow: hidden; margin-top: 16px; }
    #barFill { height: 100%; width: 0; background: #d9a441; transition: width 0.2s; }
  </style>
</head>
<body>
  <div id="unityContainer"></div>

  <div id="start">
    <form id="nameForm">
      <h1>MUCK</h1>
      <p>A game by Dani</p>
      <input id="nameInput" maxlength="24" placeholder="Your name" autocomplete="off" required>
      <button id="playBtn" type="submit">Play</button>
      <div id="bar" hidden><div id="barFill"></div></div>
    </form>
  </div>

  <script>
    // Optional page: networking and achievement popups live in Assets/Plugins/WebGL, so the Default template works too.
    var nameInput = document.getElementById('nameInput');
    try { nameInput.value = localStorage.getItem('muckPlayerName') || ''; } catch (e) {}
    nameInput.focus();

    // Keys only reach the game while its canvas has focus.
    function focusGame() {
      var canvas = document.querySelector('#unityContainer canvas');
      if (!canvas) return;
      canvas.setAttribute('tabindex', '0');
      canvas.focus();
    }

    document.getElementById('nameForm').addEventListener('submit', function (ev) {
      ev.preventDefault();
      var name = nameInput.value.trim();
      if (!name) return;
      try { localStorage.setItem('muckPlayerName', name); } catch (e) {}
      window.MUCK_PLAYER_NAME = name;

      nameInput.disabled = true;
      document.getElementById('playBtn').disabled = true;
      document.getElementById('bar').hidden = false;

      UnityLoader.instantiate('unityContainer', 'Build/Muck WEB.json', {
        onProgress: function (instance, progress) {
          document.getElementById('barFill').style.width = Math.round(progress * 100) + '%';
          if (progress >= 1) {
            document.getElementById('start').hidden = true;
            focusGame();
          }
        }
      });
    });

    document.getElementById('unityContainer').addEventListener('mousedown', focusGame);
  </script>
</body>
</html>
